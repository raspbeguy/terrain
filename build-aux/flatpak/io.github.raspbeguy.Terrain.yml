id: io.github.raspbeguy.Terrain
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
build-options:
  prepend-path: /usr/lib/sdk/ccache/bin
  append-path: /usr/lib/sdk/golang/bin
  env:
    GOFLAGS: -mod=vendor
    GOTOOLCHAIN: local
command: terrain
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.la'
  - '*.a'
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: terrain
    buildsystem: meson
    sources:
      - type: dir
        path: ../..
      # Regenerate via flatpak-go-mod after dependency bumps.
      - go.mod.yml
