name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Substitute TERRAIN_VERSION in manifest
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="99.99.99-dev"
          fi
          sed -i "s|__TERRAIN_VERSION__|${V}|" build-aux/flatpak/io.github.raspbeguy.Terrain.yml

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: terrain-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/flatpak/io.github.raspbeguy.Terrain.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('build-aux/flatpak/io.github.raspbeguy.Terrain.yml', 'build-aux/flatpak/go.mod.yml') }}
          arch: ${{ matrix.arch }}
          upload-artifact: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Smoke test the bundle
        run: |
          flatpak install --user --bundle --assumeyes ./terrain-${{ matrix.arch }}.flatpak
          flatpak run io.github.raspbeguy.Terrain --diagnose

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: terrain-${{ matrix.arch }}.flatpak
          fail_on_unmatched_files: true

  binary-glibc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            appimage_arch: x86_64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    # Ubuntu 25.04 ships libadwaita 1.7; 24.04 LTS's 1.5 is too old for gotk4-adwaita.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ubuntu:25.04
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build blueprint-compiler \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev desktop-file-utils \
            libgirepository1.0-dev git ca-certificates \
            patchelf wget file libfuse2t64 libglib2.0-bin

      - uses: actions/checkout@v7

      - name: Compute TERRAIN_VERSION
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "TERRAIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build with meson
        run: |
          meson setup build --prefix=/usr
          meson compile -C build

      - name: Package binary tarball
        run: |
          mkdir -p dist
          cp build/terrain LICENSE dist/
          tar czf terrain-linux-${{ matrix.goarch }}-glibc.tar.gz -C dist .

      - name: Install linuxdeploy
        id: linuxdeploy
        uses: miurahr/install-linuxdeploy-action@v1.8.0
        with:
          plugins: gtk appimage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEPLOY_GTK_VERSION: 4
          LDAI_OUTPUT: terrain-${{ matrix.appimage_arch }}.AppImage
        run: |
          DESTDIR="$PWD/AppDir" meson install -C build
          ${{ steps.linuxdeploy.outputs.linuxdeploy }} --appdir AppDir --plugin gtk --output appimage \
            --desktop-file AppDir/usr/share/applications/io.github.raspbeguy.Terrain.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/io.github.raspbeguy.Terrain.svg

      - name: Smoke test the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./terrain-${{ matrix.appimage_arch }}.AppImage --diagnose

      - name: Upload AppImage as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: terrain-${{ matrix.appimage_arch }}.AppImage
          path: terrain-${{ matrix.appimage_arch }}.AppImage
          if-no-files-found: error

      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            terrain-linux-${{ matrix.goarch }}-glibc.tar.gz
            terrain-${{ matrix.appimage_arch }}.AppImage
          fail_on_unmatched_files: true

  binary-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
            appimage_arch: x86_64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: aarch64
    # JS actions can't run in Alpine on arm64, so docker-run the build from the host.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore Go caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-musl-${{ matrix.goarch }}-go-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-musl-${{ matrix.goarch }}-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-musl-${{ matrix.goarch }}-go-

      - name: Build inside Alpine
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          GOARCH_TAG: ${{ matrix.goarch }}
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TERRAIN_VERSION="${GITHUB_REF_NAME#v}"
          else
            TERRAIN_VERSION="99.99.99-dev"
          fi
          export TERRAIN_VERSION
          mkdir -p ~/.cache/go-build ~/go/pkg/mod
          docker run --rm \
            -e APPIMAGE_ARCH -e GOARCH_TAG -e TERRAIN_VERSION \
            -v "$PWD":/work -w /work \
            -v "$HOME/.cache/go-build":/root/.cache/go-build \
            -v "$HOME/go/pkg/mod":/root/go/pkg/mod \
            alpine:edge sh -c '
            set -e
            apk add --no-cache \
              build-base musl-dev pkgconf meson ninja blueprint-compiler \
              desktop-file-utils \
              gtk4.0-dev libadwaita-dev gobject-introspection-dev libsecret-dev \
              git tar gzip go \
              pax-utils lddtree squashfs-tools xvfb-run
            apk add --no-cache \
              --repository=https://dl-cdn.alpinelinux.org/alpine/edge/testing \
              appimagetool
            export GOTOOLCHAIN=local
            export GOFLAGS=-buildvcs=false
            meson setup build --prefix=/usr
            meson compile -C build

            mkdir -p dist
            cp build/terrain LICENSE dist/
            tar czf "terrain-linux-${GOARCH_TAG}-musl.tar.gz" -C dist .

            rm -rf AppDir
            DESTDIR="$PWD/AppDir" meson install -C build
            OUTPUT="terrain-${APPIMAGE_ARCH}-musl.AppImage" \
                build-aux/build-appimage.sh

            # Two-step extract avoids an "exec: terrain: not found" hit by APPIMAGE_EXTRACT_AND_RUN inside docker.
            rm -rf squashfs-root
            "./terrain-${APPIMAGE_ARCH}-musl.AppImage" --appimage-extract \
                > /dev/null
            build-aux/meson/smoke.sh ./squashfs-root/AppRun 6
          '

      - name: Attach binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            terrain-linux-${{ matrix.goarch }}-musl.tar.gz
            terrain-${{ matrix.appimage_arch }}-musl.AppImage
          fail_on_unmatched_files: true

      - name: Upload AppImage as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: terrain-${{ matrix.appimage_arch }}-musl.AppImage
          path: terrain-${{ matrix.appimage_arch }}-musl.AppImage
          if-no-files-found: error
