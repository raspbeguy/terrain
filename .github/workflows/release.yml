name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: terrain-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/flatpak/io.github.raspbeguy.Terrain.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('build-aux/flatpak/io.github.raspbeguy.Terrain.yml', 'build-aux/flatpak/go.mod.yml') }}
          arch: ${{ matrix.arch }}
          upload-artifact: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Smoke test the bundle
        run: |
          flatpak install --user --bundle --assumeyes ./terrain-${{ matrix.arch }}.flatpak
          flatpak run io.github.raspbeguy.Terrain --diagnose

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true

  binary-glibc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    # Ubuntu 24.04 LTS ships libadwaita 1.5; gotk4-adwaita references 1.6+
    # symbols. Build in 25.04 (Plucky, libadwaita 1.7) so cgo compiles.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ubuntu:25.04
    steps:
      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build blueprint-compiler \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev desktop-file-utils \
            libgirepository1.0-dev git ca-certificates

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build with meson
        env:
          GOFLAGS: -buildvcs=false
        run: |
          meson setup build
          meson compile -C build

      - name: Package binary tarball
        run: |
          mkdir -p dist
          cp build/terrain LICENSE dist/
          tar czf terrain-linux-${{ matrix.goarch }}-glibc.tar.gz -C dist .

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true

  binary-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    # JS actions can't run inside Alpine on arm64 runners, so docker-run the
    # build from the host instead of using `container:`. Same pattern on
    # both archs for consistency.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Build inside Alpine
        run: |
          docker run --rm -v "$PWD":/work -w /work alpine:edge sh -c '
            set -e
            apk add --no-cache \
              build-base musl-dev pkgconf meson ninja blueprint-compiler \
              desktop-file-utils \
              gtk4.0-dev libadwaita-dev gobject-introspection-dev libsecret-dev \
              git tar gzip go
            export GOTOOLCHAIN=local
            export GOFLAGS=-buildvcs=false
            meson setup build
            meson compile -C build
            mkdir -p dist
            cp build/terrain LICENSE dist/
            tar czf terrain-linux-${{ matrix.goarch }}-musl.tar.gz -C dist .
          '

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
