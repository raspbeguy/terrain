name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: terrain.flatpak
          manifest-path: build-aux/flatpak/io.github.raspbeguy.Terrain.yml
          cache-key: flatpak-builder-${{ hashFiles('build-aux/flatpak/io.github.raspbeguy.Terrain.yml', 'build-aux/flatpak/go.mod.yml') }}
          upload-artifact: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Smoke test the bundle
        run: |
          flatpak install --user --bundle --assumeyes ./terrain.flatpak
          flatpak run io.github.raspbeguy.Terrain --diagnose

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: terrain.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
