name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Alpine ships libadwaita 1.6+ required by gotk4-adwaita; Ubuntu LTS still ships 1.5.
env:
  APK_PACKAGES: >-
    build-base git go gtk4.0-dev libadwaita-dev gobject-introspection-dev
    libsecret-dev pkgconf
  # GOTOOLCHAIN=auto overrides Alpine's `local` default so go.mod's pinned toolchain fetches.
  GOTOOLCHAIN: auto
  # Container UID mismatch breaks Go's VCS stamping even with safe.directory.
  GOFLAGS: -buildvcs=false

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    container: alpine:edge
    steps:
      - name: Install Alpine deps
        run: apk add --no-cache ${{ env.APK_PACKAGES }}

      - uses: actions/checkout@v7

      - name: Restore Go caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-alpine-go-

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./internal/...

  meson:
    name: meson build + smoke
    runs-on: ubuntu-latest
    container: alpine:edge
    steps:
      - name: Install Alpine deps
        run: |
          apk add --no-cache ${{ env.APK_PACKAGES }} \
            blueprint-compiler desktop-file-utils appstream \
            meson samurai xvfb-run libxml2-utils

      - uses: actions/checkout@v7

      - name: Restore Go caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-alpine-go-

      - name: meson setup
        run: meson setup build

      - name: meson compile
        run: meson compile -C build

      - name: meson test
        run: meson test -C build --print-errorlogs
