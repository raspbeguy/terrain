name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Run inside Alpine because it has current libadwaita (1.6+) needed by
# gotk4-adwaita. Ubuntu LTS still ships 1.5. Mirrors the dev VM.
#
# GOTOOLCHAIN=auto overrides Alpine's distro default (local) so go.mod's
# pinned 1.26 toolchain gets fetched on top of the package's 1.25.x.
env:
  APK_PACKAGES: >-
    build-base git go gtk4.0-dev libadwaita-dev gobject-introspection-dev
    libsecret-dev pkgconf
  GOTOOLCHAIN: auto
  # Skip Go's VCS stamping. Inside the container the working tree's UID
  # mismatches the runner's, and git refuses to read repo metadata even
  # with checkout's safe.directory bandage.
  GOFLAGS: -buildvcs=false

jobs:
  go:
    name: go test + vet
    runs-on: ubuntu-latest
    container: alpine:edge
    steps:
      - name: Install Alpine deps
        run: apk add --no-cache ${{ env.APK_PACKAGES }}

      - uses: actions/checkout@v6

      - name: Restore Go caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-alpine-go-

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./internal/...

  meson:
    name: meson build + smoke
    runs-on: ubuntu-latest
    container: alpine:edge
    steps:
      - name: Install Alpine deps
        run: |
          apk add --no-cache ${{ env.APK_PACKAGES }} \
            blueprint-compiler desktop-file-utils appstream \
            meson samurai xvfb-run libxml2-utils

      - uses: actions/checkout@v6

      - name: Restore Go caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-alpine-go-${{ hashFiles('go.sum') }}-
            ${{ runner.os }}-alpine-go-

      - name: meson setup
        run: meson setup build

      - name: meson compile
        run: meson compile -C build

      - name: meson test
        run: meson test -C build --print-errorlogs
